apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
  labels:
    app: seaweedfs
spec:
  replicas: 1
  # PVC is RWO — never run two pods on the same volume.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: seaweedfs
  template:
    metadata:
      labels:
        app: seaweedfs
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:latest
          # Single-node all-in-one: master + volume + filer in one process.
          # Filer HTTP API on 8888 is what the app PUTs to and browsers GET from.
          args:
            - server
            - -dir=/data
            - -filer
            - -master.volumeSizeLimitMB=1024
            - -volume.max=10
            - -filer.port=8888
          ports:
            - name: filer
              containerPort: 8888
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /
              port: 8888
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8888
            initialDelaySeconds: 30
            periodSeconds: 15
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: seaweedfs-data
