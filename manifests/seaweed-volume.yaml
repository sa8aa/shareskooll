apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweed-volume
  namespace: edushare
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seaweed-volume
  template:
    metadata:
      labels:
        app: seaweed-volume
    spec:
      # Waits for seaweed-master's Service DNS to resolve before starting.
      # k8s doesn't have compose's depends_on, so this initContainer approximates it.
      initContainers:
        - name: wait-for-master
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z seaweed-master 9333; do echo waiting for seaweed-master; sleep 2; done
      containers:
        - name: seaweed-volume
          image: chrislusf/seaweedfs
          args:
            - volume
            - -max=5
            - -mserver=seaweed-master:9333
            - -port=8080
            - -ip=seaweed-volume
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: seaweed-volume
  namespace: edushare
spec:
  selector:
    app: seaweed-volume
  ports:
    - port: 8080
      targetPort: 8080
