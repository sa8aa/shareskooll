apiVersion: apps/v1
kind: Deployment
metadata:
  name: shareschool-backend
spec:
  selector:
    matchLabels:
      app: shareschool-backend
  template:
    metadata:
      labels:
        app: shareschool-backend
    spec:
      initContainers:
        # Brings the database schema up to date before the app starts. Uses the same image
        # (tag is set for both containers by the kustomize `images:` entry), so schema and
        # code always ship together. Safe with several replicas: runners queue on a Postgres
        # advisory lock. A failure leaves the pod in Init:Error and the old pods keep serving.
        - name: migrate
          image: ghcr.io/sa8aa/shareskooll-backend
          command: ["node", "scripts/migrate.js"]
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
      containers:
        - name: backend
          image: ghcr.io/sa8aa/shareskooll-backend
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1500Mi"
              cpu: "2"
          ports:
            - containerPort: 3000
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
