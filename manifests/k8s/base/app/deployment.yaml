apiVersion: apps/v1
kind: Deployment
metadata:
  name: shareschool
spec:
  selector:
    matchLabels:
      app: shareschool
  template:
    metadata:
      labels:
        app: shareschool
    spec:
      # Image pulls are authenticated at the node level via k3s
      # /etc/rancher/k3s/registries.yaml — no per-namespace pull Secret needed.
      containers:
        - name: shareschool
          image: ghcr.io/sa8aa/shareschool
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "1500Mi"
              cpu: "2"
          ports:
            - containerPort: 3000
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
