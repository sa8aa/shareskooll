# Backend secrets (dev). Values come from Infisical (project `shareskool`) through
# the ClusterSecretStore named below. The frontend needs no secrets.
#
# Keys read from Infisical:
#   SHARESKOOL_DEV_POSTGRES_USERNAME / SHARESKOOL_DEV_POSTGRES_PASSWORD   (role shareskool_dev, db shareskool_dev)
#   SHARESKOOL_JWT_SECRET
#   SHARESKOOL_DEEPSEEK_API_KEY
#   SHARESKOOL_AZURE_OCR_API_KEY, SHARESKOOL_AZURE_OCR_ENDPOINT
#   SHARESKOOL_ADMIN_EMAIL, SHARESKOOL_ADMIN_PASSWORD
#   SHARESKOOL_TEACHER_EMAIL, SHARESKOOL_TEACHER_PASSWORD
#
# Pods read their environment only at start. After changing a value in
# Infisical, restart: kubectl rollout restart deployment/shareschool-backend -n shareschool-dev
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: shareschool-backend-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical-dev
    kind: ClusterSecretStore
  target:
    name: shareschool-backend-secrets
    creationPolicy: Owner
  data:
    - { secretKey: DATABASE_USER,       remoteRef: { key: SHARESKOOL_DEV_POSTGRES_USERNAME } }
    - { secretKey: DATABASE_PASSWORD,   remoteRef: { key: SHARESKOOL_DEV_POSTGRES_PASSWORD } }
    - { secretKey: JWT_SECRET,          remoteRef: { key: SHARESKOOL_JWT_SECRET } }
    - { secretKey: DEEPSEEK_API_KEY,    remoteRef: { key: SHARESKOOL_DEEPSEEK_API_KEY } }
    - { secretKey: AZURE_OCR_API_KEY,   remoteRef: { key: SHARESKOOL_AZURE_OCR_API_KEY } }
    - { secretKey: AZURE_OCR_ENDPOINT,  remoteRef: { key: SHARESKOOL_AZURE_OCR_ENDPOINT } }
    - { secretKey: ADMIN_EMAIL,         remoteRef: { key: SHARESKOOL_ADMIN_EMAIL } }
    - { secretKey: ADMIN_PASSWORD,      remoteRef: { key: SHARESKOOL_ADMIN_PASSWORD } }
    - { secretKey: TEACHER_EMAIL,       remoteRef: { key: SHARESKOOL_TEACHER_EMAIL } }
    - { secretKey: TEACHER_PASSWORD,    remoteRef: { key: SHARESKOOL_TEACHER_PASSWORD } }
---
# Registry pull credential for ghcr.io (private images). Built from the same
# GitHub PAT (read:packages) that Kargo uses, stored in Infisical as KARGO_GHCR_TOKEN.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-pull
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical-dev
    kind: ClusterSecretStore
  target:
    name: ghcr-pull
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"ghcr.io":{"username":"sa8aa","password":"{{ .token }}","auth":"{{ printf "sa8aa:%s" .token | b64enc }}"}}}'
  data:
    - secretKey: token
      remoteRef:
        key: KARGO_GHCR_TOKEN
