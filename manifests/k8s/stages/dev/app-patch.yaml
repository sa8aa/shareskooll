apiVersion: apps/v1
kind: Deployment
metadata:
  name: shareschool
spec:
  template:
    spec:
      containers:
        - name: shareschool
          envFrom:
            - configMapRef:
                name: shareschool-config
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shareschool-backend
spec:
  template:
    spec:
      containers:
        - name: backend
          envFrom:
            - configMapRef:
                name: shareschool-backend-config
            - secretRef:
                name: shareschool-backend-secrets
