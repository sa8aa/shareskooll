apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shareschool-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - dev.shareschool.net
      secretName: shareschool-dev-tls
  rules:
    - host: dev.shareschool.net
      http:
        paths:
          - pathType: Prefix
            path: "/"
            backend:
              service:
                name: shareschool
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shareschool-backend-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api-dev.shareschool.net
      secretName: shareschool-backend-dev-tls
  rules:
    - host: api-dev.shareschool.net
      http:
        paths:
          - pathType: Prefix
            path: "/"
            backend:
              service:
                name: shareschool-backend
                port:
                  number: 80
