apiVersion: v1
kind: ConfigMap
metadata:
  name: shareschool-config
data:
  NODE_ENV: "production"
  TZ: "Africa/Tunis"
  # NEXT_PUBLIC_* are baked into the client bundle at image build time
  # (see .github/workflows/build.yml); listed here for reference only.
  NEXT_PUBLIC_SITE_URL: "https://shareschool.net"
  NEXT_PUBLIC_API_URL: "https://api.shareschool.net"
  NEXT_PUBLIC_SEAWEED_URL: "https://cdn.shareschool.net"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: shareschool-backend-config
data:
  NODE_ENV: "production"
  PORT: "3000"
  TZ: "Africa/Tunis"
  # CORS origin + socket.io origin (single value).
  FRONTEND_URL: "https://shareschool.net"
  BACKEND_URL: "https://api.shareschool.net"
  # Same Postgres cluster as before (CloudNativePG, pgvector already installed).
  DATABASE_HOST: "postgres-rw.database.svc"
  DATABASE_PORT: "5432"
  DATABASE_NAME: "shareskool"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  # Shared SeaweedFS filer in the `seaweedfs` namespace.
  SEAWEED_FILER_URL: "http://seaweedfs.seaweedfs.svc:8888"
