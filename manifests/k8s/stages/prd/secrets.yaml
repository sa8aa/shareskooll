# Secrets for ShareSkool (prd). Values come from Infisical (project `shareskool`,
# environment `prod`, path `/`) through the ClusterSecretStore `infisical`.
#
# Keys read from Infisical:
#   SHARESKOOL_POSTGRES_USERNAME / SHARESKOOL_POSTGRES_PASSWORD   (already there)
#   SHARESKOOL_NEXTAUTH_SECRET, SHARESKOOL_BETTER_AUTH_SECRET, SHARESKOOL_CRON_SECRET
#   SHARESKOOL_TWILIO_ACCOUNT_SID, SHARESKOOL_TWILIO_AUTH_TOKEN, SHARESKOOL_TWILIO_WHATSAPP_FROM
#
# Pods read their environment only at start. After changing a value in
# Infisical, restart: kubectl rollout restart deployment/<name> -n shareschool-prd
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: shareschool-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: shareschool-secrets
    creationPolicy: Owner
    template:
      data:
        DATABASE_URL: "postgresql://{{ .pguser }}:{{ .pgpass }}@postgres-rw.database.svc:5432/shareskool?schema=public"
        NEXTAUTH_SECRET: "{{ .nextauth }}"
        BETTER_AUTH_SECRET: "{{ .betterauth }}"
        CRON_SECRET: "{{ .cron }}"
        TWILIO_ACCOUNT_SID: "{{ .twsid }}"
        TWILIO_AUTH_TOKEN: "{{ .twtoken }}"
        TWILIO_WHATSAPP_FROM: "{{ .twfrom }}"
  data:
    - { secretKey: pguser,     remoteRef: { key: SHARESKOOL_POSTGRES_USERNAME } }
    - { secretKey: pgpass,     remoteRef: { key: SHARESKOOL_POSTGRES_PASSWORD } }
    - { secretKey: nextauth,   remoteRef: { key: SHARESKOOL_NEXTAUTH_SECRET } }
    - { secretKey: betterauth, remoteRef: { key: SHARESKOOL_BETTER_AUTH_SECRET } }
    - { secretKey: cron,       remoteRef: { key: SHARESKOOL_CRON_SECRET } }
    - { secretKey: twsid,      remoteRef: { key: SHARESKOOL_TWILIO_ACCOUNT_SID } }
    - { secretKey: twtoken,    remoteRef: { key: SHARESKOOL_TWILIO_AUTH_TOKEN } }
    - { secretKey: twfrom,     remoteRef: { key: SHARESKOOL_TWILIO_WHATSAPP_FROM } }