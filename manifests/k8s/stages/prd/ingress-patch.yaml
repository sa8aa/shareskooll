apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shareschool-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    # Send www.shareschool.net -> shareschool.net (301), preserving the full path + query.
    # IMPORTANT: do NOT also add a `www.shareschool.net` rule below. This annotation
    # AUTO-creates the www redirect server; if www is also listed as a serving
    # rule it serves the app instead of redirecting. www stays in `tls` so the
    # auto redirect happens over HTTPS without a cert error.
    nginx.ingress.kubernetes.io/from-to-www-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - shareschool.net
        - www.shareschool.net
      secretName: shareschool-prd-tls
  rules:
    - host: shareschool.net
      http:
        paths:
          - pathType: Prefix
            path: "/"
            backend:
              service:
                name: shareschool
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shareschool-backend-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.shareschool.net
      secretName: shareschool-backend-prd-tls
  rules:
    - host: api.shareschool.net
      http:
        paths:
          - pathType: Prefix
            path: "/"
            backend:
              service:
                name: shareschool-backend
                port:
                  number: 80
