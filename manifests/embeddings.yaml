apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: embeddings-data
  namespace: edushare
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: embeddings
  namespace: edushare
spec:
  replicas: 1
  selector:
    matchLabels:
      app: embeddings
  template:
    metadata:
      labels:
        app: embeddings
    spec:
      containers:
        - name: embeddings
          image: hwdsl2/embeddings-server
          ports:
            - containerPort: 8000
          env:
            - name: EMBEDDING_MODEL
              value: "BAAI/bge-m3"
          volumeMounts:
            - name: embeddings-data
              mountPath: /var/lib/embeddings
      volumes:
        - name: embeddings-data
          persistentVolumeClaim:
            claimName: embeddings-data
---
apiVersion: v1
kind: Service
metadata:
  name: embeddings
  namespace: edushare
spec:
  selector:
    app: embeddings
  ports:
    - port: 8000
      targetPort: 8000
