apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-cred
  namespace: shareschool-kargo
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical-dev
    kind: ClusterSecretStore
  target:
    name: ghcr-cred
    creationPolicy: Owner
    template:
      metadata:
        labels:
          kargo.akuity.io/cred-type: image
      data:
        repoURL: ghcr.io/sa8aa/shareskooll-frontend
        username: sa8aa
        password: "{{ .token }}"
  data:
    - secretKey: token
      remoteRef:
        key: KARGO_GHCR_TOKEN
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: shareschool-repo
  namespace: shareschool-kargo
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical-dev
    kind: ClusterSecretStore
  target:
    name: shareschool-repo
    creationPolicy: Owner
    template:
      metadata:
        labels:
          kargo.akuity.io/cred-type: git
      data:
        repoURL: https://github.com/sa8aa/shareskooll.git
        username: sa8aa
        password: "{{ .token }}"
  data:
    - secretKey: token
      remoteRef:
        key: KARGO_GIT_TOKEN