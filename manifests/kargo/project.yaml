apiVersion: kargo.akuity.io/v1alpha1
kind: Project
metadata:
  name: shareschool-kargo
---
apiVersion: kargo.akuity.io/v1alpha1
kind: ProjectConfig
metadata:
  name: shareschool-kargo
  namespace: shareschool-kargo
spec:
  promotionPolicies:
    - stageSelector:
        name: prd
      autoPromotionEnabled: false
    - stageSelector:
        name: dev
      autoPromotionEnabled: true