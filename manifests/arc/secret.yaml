# GitHub credential the runner scale set uses to register runners and listen
# for jobs. Value comes from Infisical (store infisical-dev, key GH_ARC_TOKEN or KARGO_GIT_TOKEN).
#
# Token: a GitHub PAT (classic) with the `repo` scope, created by an account
# that is admin of sa8aa/shareskooll (repo-level runners need admin rights).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: arc-github-secret
  namespace: arc-runners
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical-dev
    kind: ClusterSecretStore
  target:
    name: arc-github-secret
    creationPolicy: Owner
  data:
    - secretKey: github_token
      remoteRef:
        key: KARGO_GIT_TOKEN
