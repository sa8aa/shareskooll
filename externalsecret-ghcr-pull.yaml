apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  name: ghcr-pull
spec:
  data:
  - remoteRef:
      key: KARGO_GHCR_TOKEN
    secretKey: token
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical-dev
  target:
    creationPolicy: Owner
    name: ghcr-pull
    template:
      data:
        .dockerconfigjson: '{"auths":{"ghcr.io":{"username":"sa8aa","password":"{{
          .token }}","auth":"{{ printf "sa8aa:%s" .token | b64enc }}"}}}'
      type: kubernetes.io/dockerconfigjson
