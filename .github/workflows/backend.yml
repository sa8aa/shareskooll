name: Backend Pipeline
on:
  push:
    branches:
      - develop
    paths:
      - 'backend/**'
  pull_request:
    branches:
      - develop
    types: [opened, synchronize, reopened, closed]
    paths:
      - 'backend/**'

permissions:
  contents: read
  packages: write

jobs:
  sonarqube:
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    uses: ./.github/workflows/sonarqube.yml
    secrets: inherit

  backend-build:
    needs: sonarqube
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          docker system prune -af

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ./backend
        run: npm install --legacy-peer-deps

      - name: Build project
        working-directory: ./backend
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (local only, no push)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-backend:develop
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-backend:${{ github.sha }}

      - name: Save image to tar
        run: docker save ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-backend:${{ github.sha }} -o backend-image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-image
          path: backend-image.tar
          retention-days: 1

  trivy-backend:
    needs: backend-build
    uses: ./.github/workflows/trivy.yml
    with:
      service: backend
      artifact-name: backend-image
      image-tag: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-backend:${{ github.sha }}
      image-tag-develop: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-backend:develop
      report-name: trivy-backend-report
    secrets: inherit
