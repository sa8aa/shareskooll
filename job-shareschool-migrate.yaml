apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
  name: shareschool-migrate
spec:
  backoffLimit: 2
  template:
    spec:
      containers:
      - command:
        - sh
        - -lc
        - pnpm prisma:deploy && npx tsx scripts/seed-categories.ts -y && npx tsx scripts/seed-governorates.ts
          -y && npx tsx scripts/seed-legal.ts -y
        envFrom:
        - configMapRef:
            name: shareschool-config
        - secretRef:
            name: shareschool-secrets
        image: ghcr.io/sa8aa/shareskooll-frontend-migrate:placeholder
        name: migrate
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 50m
            memory: 128Mi
      restartPolicy: Never
