apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  name: shareschool-backend-secrets
spec:
  data:
  - remoteRef:
      key: SHARESKOOL_DEV_POSTGRES_USERNAME
    secretKey: DATABASE_USER
  - remoteRef:
      key: SHARESKOOL_DEV_POSTGRES_PASSWORD
    secretKey: DATABASE_PASSWORD
  - remoteRef:
      key: SHARESKOOL_JWT_SECRET
    secretKey: JWT_SECRET
  - remoteRef:
      key: SHARESKOOL_DEEPSEEK_API_KEY
    secretKey: DEEPSEEK_API_KEY
  - remoteRef:
      key: SHARESKOOL_AZURE_OCR_API_KEY
    secretKey: AZURE_OCR_API_KEY
  - remoteRef:
      key: SHARESKOOL_AZURE_OCR_ENDPOINT
    secretKey: AZURE_OCR_ENDPOINT
  - remoteRef:
      key: SHARESKOOL_ADMIN_EMAIL
    secretKey: ADMIN_EMAIL
  - remoteRef:
      key: SHARESKOOL_ADMIN_PASSWORD
    secretKey: ADMIN_PASSWORD
  - remoteRef:
      key: SHARESKOOL_TEACHER_EMAIL
    secretKey: TEACHER_EMAIL
  - remoteRef:
      key: SHARESKOOL_TEACHER_PASSWORD
    secretKey: TEACHER_PASSWORD
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical-dev
  target:
    creationPolicy: Owner
    name: shareschool-backend-secrets
