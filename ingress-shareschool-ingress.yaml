apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/from-to-www-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: 45m
  name: shareschool-ingress
spec:
  ingressClassName: nginx
  rules:
  - host: shareschool.net
    http:
      paths:
      - backend:
          service:
            name: shareschool
            port:
              number: 80
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - shareschool.net
    - www.shareschool.net
    secretName: shareschool-prd-tls
