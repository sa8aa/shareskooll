apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  name: shareschool-secrets
spec:
  data:
  - remoteRef:
      key: SHARESKOOL_POSTGRES_USERNAME
    secretKey: pguser
  - remoteRef:
      key: SHARESKOOL_POSTGRES_PASSWORD
    secretKey: pgpass
  - remoteRef:
      key: SHARESKOOL_NEXTAUTH_SECRET
    secretKey: nextauth
  - remoteRef:
      key: SHARESKOOL_BETTER_AUTH_SECRET
    secretKey: betterauth
  - remoteRef:
      key: SHARESKOOL_CRON_SECRET
    secretKey: cron
  - remoteRef:
      key: SHARESKOOL_TWILIO_ACCOUNT_SID
    secretKey: twsid
  - remoteRef:
      key: SHARESKOOL_TWILIO_AUTH_TOKEN
    secretKey: twtoken
  - remoteRef:
      key: SHARESKOOL_TWILIO_WHATSAPP_FROM
    secretKey: twfrom
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical-dev
  target:
    creationPolicy: Owner
    name: shareschool-secrets
    template:
      data:
        BETTER_AUTH_SECRET: '{{ .betterauth }}'
        CRON_SECRET: '{{ .cron }}'
        DATABASE_URL: postgresql://{{ .pguser }}:{{ .pgpass }}@postgres-rw.database.svc:5432/DEV_DB_NAME?schema=public
        NEXTAUTH_SECRET: '{{ .nextauth }}'
        TWILIO_ACCOUNT_SID: '{{ .twsid }}'
        TWILIO_AUTH_TOKEN: '{{ .twtoken }}'
        TWILIO_WHATSAPP_FROM: '{{ .twfrom }}'
